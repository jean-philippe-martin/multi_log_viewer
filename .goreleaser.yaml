version: 2

project_name: multi_log_viewer

before:
  hooks:
    - go mod tidy

builds:
  - id: mlv
    main: ./cmd/mlv
    binary: mlv
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: loggen
    main: ./cmd/loggen
    binary: loggen
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - mlv.yaml
      - themes/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: jpmartin
    name: multi_log_viewer
